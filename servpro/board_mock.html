<!DOCTYPE html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Red Hat Display";src:url("fonts/RedHatDisplay.ttf");font-weight:300 900;}
@font-face{font-family:"Red Hat Text";src:url("fonts/RedHatText.ttf");font-weight:300 700;}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#110708;}
.stage{position:relative;width:1920px;height:1080px;background:url("board_current.jpg") no-repeat 0 0 / 1920px 1080px;}
.cover{position:absolute;left:520px;top:745px;width:880px;height:300px;background:radial-gradient(ellipse at 50% 20%, #1c0b0e 0%, #130708 70%);}
.panel{position:absolute;left:545px;top:760px;width:830px;height:262px;box-sizing:border-box;border:2.5px solid #FF6720;border-radius:14px;background:#24222F;color:#fff;font-family:"Red Hat Text",Arial,sans-serif;}
.label{position:absolute;left:0;right:0;top:22px;text-align:center;font-family:"Red Hat Display";font-weight:500;font-size:17px;letter-spacing:.32em;text-transform:uppercase;color:#E9E6EE;}
.lockup{position:absolute;left:104px;top:50px;width:380px;text-align:center;}
.lockup img{width:360px;display:block;margin:0 auto;}
.fname{font-family:"Red Hat Display";font-weight:700;font-size:20px;letter-spacing:.02em;color:#fff;margin-top:2px;}
.fname .reg{font-size:11px;vertical-align:top;position:relative;top:1px;}
.fname .of{font-weight:400;}
.divider{position:absolute;left:548px;top:66px;width:1px;height:116px;background:#5a5663;}
.partner{position:absolute;left:580px;top:76px;width:220px;text-align:center;}
.partner .pl{font-family:"Red Hat Display";font-weight:500;font-size:12.5px;letter-spacing:.3em;text-transform:uppercase;color:#E9E6EE;margin-bottom:10px;}
.partner img{width:167px;display:block;margin:0 auto;}
.tag{position:absolute;left:0;right:0;top:188px;text-align:center;font-family:"Red Hat Text";font-weight:400;font-size:22px;color:#6CC24A;}
.tag .reg{font-size:11px;vertical-align:top;position:relative;top:2px;}
.info{position:absolute;left:0;right:0;top:218px;text-align:center;font-family:"Red Hat Text";font-weight:500;font-size:14.5px;letter-spacing:.04em;color:#E9E6EE;}
.info b{color:#FF6720;font-weight:700;}
.disc{position:absolute;left:0;right:0;top:240px;text-align:center;font-family:"Red Hat Text";font-weight:400;font-size:12px;color:#B9B5C2;}
</style></head><body>
<div class="stage">
  <div class="cover"></div>
  <div class="panel">
    <div class="label">Schedule brought to you by</div>
    <div class="lockup">
      <img src="logo_crop.png" alt="SERVPRO">
      <div class="fname">SERVPRO<span class="reg">®</span> <span class="of">of</span> Columbus / Starkville</div>
    </div>
    <div class="divider"></div>
    <div class="partner"><div class="pl">Proud partner of</div><img src="bulldog_crop.png" alt="The Bulldog Initiative"></div>
    <div class="tag">Like it never even happened.<span class="reg">®</span></div>
    <div class="info">Cleaning. Restoration. Construction. &nbsp;·&nbsp; 24/7 emergency service &nbsp;·&nbsp; <b>662-324-3003</b></div>
    <div class="disc">Independently owned and operated</div>
  </div>
</div>
</body></html>
