<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tom Smith Land &amp; Homes — 30s Digital Ad (1920×1080)</title>
<style>
/* ---------- fonts (all local, so renders are deterministic) ---------- */
@font-face{font-family:'Montserrat';font-weight:300;src:url(assets/fonts/Montserrat-300.ttf)}
@font-face{font-family:'Montserrat';font-weight:400;src:url(assets/fonts/Montserrat-400.ttf)}
@font-face{font-family:'Montserrat';font-weight:500;src:url(assets/fonts/Montserrat-500.ttf)}
@font-face{font-family:'Montserrat';font-weight:600;src:url(assets/fonts/Montserrat-600.ttf)}
@font-face{font-family:'Montserrat';font-weight:700;src:url(assets/fonts/Montserrat-700.ttf)}
@font-face{font-family:'Montserrat';font-weight:800;src:url(assets/fonts/Montserrat-800.ttf)}
@font-face{font-family:'TSSerif';font-weight:400;src:url(assets/fonts/LiberationSerif-Regular.ttf)}
@font-face{font-family:'TSSerif';font-weight:700;src:url(assets/fonts/LiberationSerif-Bold.ttf)}

/* ---------- brand palette (sampled from the business card) ---------- */
:root{
  --blue:#134d95;        /* bottom band */
  --navy:#12365f;        /* name text */
  --green:#7d9c3e;       /* wave stripe */
  --text:#3a3a3a;
  --grey:#6f7784;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;
  background:#e9efe0 url(assets/img/background.jpg) center/cover no-repeat;
  font-family:Montserrat,sans-serif}
/* light wash over the park photo so the navy type and the green parts of the logo stay legible */
#stage::before{content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,.58) 0%,rgba(255,255,255,.50) 55%,rgba(255,255,255,.42) 100%)}
.abs{position:absolute}
.slide{position:absolute;inset:0}

/* ---------- timeline ----------------------------------------------------
   0.0–0.9 s  wave + band rise in
   0.3–1.0 s  roof appears (wipes on left to right)
   1.0–2.2 s  the two pines rise, one after the other
   2.2–3.8 s  "Tom", "Smith", "LAND AND", "HOMES", tagline drop in from above
   5.0–6.2 s  a light sweeps across the logo
   9.5–10.0 s logo pulses
   9.9–11.4 s the wave sweeps up through the frame (transition)
   10.65 s    while covered: logo jumps to its slide-2 spot
   10.8–11.7  Chance's slide is revealed bottom-up, elements settle in
   ----------------------------------------------------------------------- */

/* ---------- green wave + blue band (persistent, like the card) ---------- */
#band{position:absolute;left:0;top:0;animation:bandIn 900ms 0ms both cubic-bezier(.2,.8,.2,1)}
@keyframes bandIn{from{transform:translateY(460px)}to{transform:none}}

/* ---------- the logo: one element that travels between slides ---------- */
/* The supplied logo, cut into layers (assets/img/logo/*.png) so the intro can
   build it piece by piece. Layer geometry comes from layers.js. */
#logo{position:absolute;left:640px;top:40px;width:640px;transform-origin:0 0;
  animation:logoMove 30000ms linear both}
#logoInner{position:relative;width:100%;height:100%;transform-origin:50% 50%;
  animation:pulse 520ms 9480ms both cubic-bezier(.4,0,.2,1)}
#logo .lg{position:absolute;display:block;
  filter:drop-shadow(0 0 2.5px #fff) drop-shadow(0 0 2.5px #fff) drop-shadow(0 0 10px rgba(255,255,255,.85))}
@keyframes logoMove{
  0%,35.5%        {transform:translate(0,0) scale(1)}
  35.501%,100%    {transform:translate(700px,20px) scale(.84375)}
}
@keyframes pulse{0%{transform:scale(1)}45%{transform:scale(1.07)}100%{transform:scale(1)}}

/* slide 1 — the logo builds itself: roof, then the pines rise, then the lettering drops in */
.lg-roof   {animation:wipe 700ms 300ms both cubic-bezier(.4,0,.2,1)}
@keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.lg-treeA  {transform-origin:50% 100%;animation:grow 950ms 1000ms both cubic-bezier(.34,1.3,.64,1)}
.lg-treeB  {transform-origin:50% 100%;animation:grow 950ms 1250ms both cubic-bezier(.34,1.3,.64,1)}
@keyframes grow{from{opacity:0;transform:scaleY(.04) scaleX(.7)}to{opacity:1;transform:none}}
.lg-tom    {animation:drop 650ms 2200ms both cubic-bezier(.34,1.56,.64,1)}
.lg-smith  {animation:drop 650ms 2400ms both cubic-bezier(.34,1.56,.64,1)}
.lg-landand{animation:drop 650ms 2650ms both cubic-bezier(.34,1.56,.64,1)}
.lg-homes  {animation:drop 650ms 2850ms both cubic-bezier(.34,1.56,.64,1)}
.lg-tagline{animation:dropSoft 650ms 3200ms both cubic-bezier(.2,.8,.2,1)}
@keyframes drop{from{opacity:0;transform:translateY(-170px)}to{opacity:1;transform:none}}
@keyframes dropSoft{from{opacity:0;transform:translateY(-60px)}to{opacity:1;transform:none}}
/* a light sweeping across the logo while it holds */
#shine{position:absolute;inset:0;pointer-events:none;
  -webkit-mask:url(assets/img/logo/logo.png) 0 0/100% 100% no-repeat;mask:url(assets/img/logo/logo.png) 0 0/100% 100% no-repeat;
  background:linear-gradient(112deg,rgba(255,255,255,0) 42%,rgba(255,255,255,.75) 50%,rgba(255,255,255,0) 58%);
  background-size:260% 100%;background-repeat:no-repeat;
  animation:shine 1200ms 5000ms both cubic-bezier(.4,0,.6,1)}
@keyframes shine{from{background-position:130% 0}to{background-position:-30% 0}}

/* ---------- the transition: a wave sweeps up through the frame ---------- */
#wipe{position:absolute;left:-240px;top:1080px;transform-origin:50% 0;
  animation:sweep 1500ms 9900ms both cubic-bezier(.65,0,.35,1)}
@keyframes sweep{from{transform:rotate(-3deg) translateY(0)}to{transform:rotate(-3deg) translateY(-4200px)}}

/* ---------- shared text styles ---------- */
.name{text-shadow:0 0 10px rgba(255,255,255,.95),0 0 22px rgba(255,255,255,.9),0 0 40px rgba(255,255,255,.7)}
.name .first{font-weight:300;font-size:64px;line-height:1;color:var(--navy);letter-spacing:3px}
.name .last {font-weight:800;font-size:78px;line-height:1.05;color:var(--navy);margin-top:4px;letter-spacing:1px}
.name .role {font-weight:400;font-size:32px;line-height:1;color:var(--grey);letter-spacing:5px;margin-top:14px}
.name .role sup{font-size:.45em;letter-spacing:0}
.name .lbl{font-weight:500;font-size:32px;line-height:1;color:var(--grey);letter-spacing:1px;margin-top:34px}
.name .lbl + .num + .lbl{margin-top:24px}
.name .num{font-weight:700;font-size:46px;line-height:1.1;color:var(--text);margin-top:6px}

.band-text .h1{font-family:TSSerif,serif;font-weight:700;font-size:74px;line-height:1.05;color:#fff}
.band-text .h2{font-family:TSSerif,serif;font-weight:700;font-size:50px;line-height:1.1;color:#fff;margin-top:8px}
.url{font-family:Montserrat,sans-serif;font-weight:500;font-size:30px;line-height:1;color:#dfe9f8;letter-spacing:1px;margin-top:16px}

.cut{display:block}

/* ---------- enter / exit ---------- */
@keyframes upIn   {from{opacity:0;transform:translateY(140px)}to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(34px)}to{opacity:1;transform:none}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}

/* slide 1 (0–10.65 s) */
#s1 .url{animation:rise 700ms 3600ms both cubic-bezier(.2,.8,.2,1),fadeOut 400ms 9500ms forwards}

/* slide 2 (revealed 10.8–11.4 s, holds to 30 s) */
#chance   {animation:upIn 900ms 10850ms both cubic-bezier(.2,.8,.2,1)}
#s2 .h1   {animation:rise 650ms 10950ms both cubic-bezier(.2,.8,.2,1)}
#s2 .h2   {animation:rise 650ms 11050ms both cubic-bezier(.2,.8,.2,1)}
#s2 .url  {animation:rise 650ms 11150ms both cubic-bezier(.2,.8,.2,1)}
#s2 .first{animation:slideIn 600ms 11150ms both cubic-bezier(.2,.8,.2,1)}
#s2 .last {animation:slideIn 600ms 11250ms both cubic-bezier(.2,.8,.2,1)}
#s2 .role {animation:slideIn 600ms 11350ms both cubic-bezier(.2,.8,.2,1)}
#s2 .p1   {animation:slideIn 600ms 11500ms both cubic-bezier(.2,.8,.2,1)}
#s2 .p2   {animation:slideIn 600ms 11570ms both cubic-bezier(.2,.8,.2,1)}
#s2 .p3   {animation:slideIn 600ms 11680ms both cubic-bezier(.2,.8,.2,1)}
#s2 .p4   {animation:slideIn 600ms 11750ms both cubic-bezier(.2,.8,.2,1)}
</style>
</head>
<body>
<div id="stage">

  <!-- green wave + blue band -->
  <svg id="band" width="1920" height="1080" viewBox="0 0 1920 1080" aria-hidden="true">
    <path fill="var(--green)" d="M0,646 C400,656 700,786 960,776 C1250,766 1500,686 1920,696 L1920,1080 L0,1080 Z"/>
    <path fill="var(--blue)"  d="M0,690 C400,700 700,830 960,820 C1250,810 1500,730 1920,740 L1920,1080 L0,1080 Z"/>
  </svg>

  <!-- slide 1: intro -->
  <div class="slide" id="s1">
    <div class="abs url" style="left:0;width:1920px;top:944px;text-align:center;margin:0">TomSmithLandandHomes.com</div>
  </div>

  <!-- slide 2: Chance Persac (mirrors the business card layout) -->
  <div class="slide" id="s2">
    <img class="abs cut" id="chance" src="assets/img/chance-cutout.png" alt="" style="left:40px;bottom:-8px;height:1008px">
    <div class="abs name" style="left:880px;top:104px">
      <div class="first">CHANCE</div>
      <div class="last">PERSAC</div>
      <div class="role">REALTOR<sup>®</sup></div>
      <div class="lbl p1">Office phone:</div>
      <div class="num p2">(662)268-6333</div>
      <div class="lbl p3">Cell phone:</div>
      <div class="num p4">(601) 955-4587</div>
    </div>
    <div class="abs band-text" style="left:860px;width:1020px;top:822px;text-align:center">
      <div class="h1">LAND OR HOME?</div>
      <div class="h2">GET THE BEST OF BOTH WORLDS.</div>
      <div class="url">TomSmithLandandHomes.com</div>
    </div>
  </div>

  <!-- the logo (built from assets/img/logo/*.png) -->
  <div id="logo"><div id="logoInner"></div></div>

  <!-- the transition wave: green-edged blue sheet that sweeps up through the frame -->
  <svg id="wipe" width="2400" height="3000" viewBox="0 0 2400 3000" aria-hidden="true">
    <path fill="var(--green)" d="M0,150 C500,60 875,230 1200,190 C1560,150 1880,30 2400,90 L2400,2900 C1880,2960 1560,2840 1200,2880 C875,2920 500,2750 0,2840 Z"/>
    <path fill="var(--blue)"  d="M0,205 C500,115 875,285 1200,245 C1560,205 1880,85 2400,145 L2400,2845 C1880,2905 1560,2785 1200,2825 C875,2865 500,2695 0,2785 Z"/>
  </svg>
</div>

<script src="assets/img/logo/layers.js"></script>
<script>
/* ---- logo layers ------------------------------------------------------ */
(function(){
  const box = document.getElementById('logo'), inner = document.getElementById('logoInner');
  const [CW, CH] = LOGO_LAYERS.canvas;
  box.style.height = (640 * CH / CW) + 'px';
  for (const name of LOGO_LAYERS.order) {          /* pines behind everything, lettering on top */
    const g = LOGO_LAYERS.layers[name];
    const img = document.createElement('img');
    img.src = `assets/img/logo/${name}.png`;
    img.className = 'lg lg-' + name;
    img.style.left  = (g.x / CW * 100) + '%';
    img.style.top   = (g.y / CH * 100) + '%';
    img.style.width = (g.w / CW * 100) + '%';
    inner.appendChild(img);
  }
  const shine = document.createElement('div'); shine.id = 'shine'; inner.appendChild(shine);
})();

/* ---- deterministic playback hooks used by render.js ------------------- */
window.__pauseAll = () => document.getAnimations().forEach(a => a.pause());
window.__seek     = (t) => document.getAnimations().forEach(a => { a.currentTime = t; });
</script>
</body>
</html>
