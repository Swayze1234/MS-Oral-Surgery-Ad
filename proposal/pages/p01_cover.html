<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts.css"><link rel="stylesheet" href="../style.css">
<style>
  .page.cover { background: var(--navy); }
  .cover-photo {
    position: absolute; inset: 0;
    background: var(--navy) center 45% / cover no-repeat;
    /* build.py sets the background-image from assets/cover/ */
  }
  .scrim {
    position: absolute; inset: 0;
    background: linear-gradient(93deg, rgba(7,12,22,0.88) 0%, rgba(7,12,22,0.72) 38%, rgba(9,15,28,0.42) 72%, rgba(9,15,28,0.30) 100%),
                linear-gradient(to top, rgba(7,12,22,0.72) 0%, rgba(7,12,22,0.05) 34%),
                linear-gradient(to bottom, rgba(7,12,22,0.45) 0%, rgba(7,12,22,0) 22%);
  }
  .cover .inner { inset: 0.5in 0.7in 0.42in 0.7in; }
  .logorow { display: flex; justify-content: space-between; align-items: flex-start; }
  .logorow .mctv img { height: 0.5in; display: block; }
  /* real Financial Concepts logo drops in here from assets/cover/*logo*; empty until then */
  .fincon img { height: 0.6in; display: block; }
  .titleblock { margin-top: auto; }
  .cover .kicker { color: #CBD6E6; font-size: 9.5pt; }
  .cover .kicker::after { border-bottom-color: #C9A227; }
  .cover h1 {
    color: #FFFFFF; font-size: 44pt; font-weight: 600;
    letter-spacing: 0.005em; margin-top: 0.17in; line-height: 1.07;
  }
  .clientpill {
    display: inline-block; margin-top: 0.24in;
    border: 1.5px solid rgba(255,255,255,0.85); border-radius: 3px;
    padding: 0.075in 0.16in;
    font-size: 9.5pt; font-weight: 700; letter-spacing: 0.26em; text-transform: uppercase; color: #fff;
  }
  .coverfoot {
    margin-top: 0.42in;
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 8pt; font-weight: 600; letter-spacing: 0.24em;
    text-transform: uppercase; color: #C3CDDC;
  }
</style></head>
<body>
<div class="page cover">
  <div class="cover-photo"></div>
  <div class="scrim"></div>
  <div class="inner">
    <div class="logorow">
      <div class="mctv"><img src="../assets/mctv_logo_white.png" alt="MCTV Elite Advertising"></div>
      <div class="fincon" id="fincon-logo"></div>
    </div>
    <div class="titleblock">
      <div class="kicker">Advertiser Partnership Proposal</div>
      <h1>Own the room,<br>not just the road.</h1>
      <div class="clientpill">Financial Concepts</div>
    </div>
    <div class="coverfoot">
      <span>Prepared for Financial Concepts &middot; Columbus, MS</span>
      <span>August 27, 2026</span>
    </div>
  </div>
</div>
</body></html>
