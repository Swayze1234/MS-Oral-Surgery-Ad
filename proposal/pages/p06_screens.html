<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts.css"><link rel="stylesheet" href="../style.css">
<style>
  .grid { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: 1fr 1fr; gap: 0.22in; margin-top: 0.24in; }
  .slot { display: flex; flex-direction: column; }
  .slot .frame { flex: 1; min-height: 0; }
  .slot figcaption { margin-top: 0.06in; font-size: 7.5pt; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--steel); }
</style></head>
<body>
<div class="page">
  <div class="inner">
    <div class="kicker">On Location</div>

      <figure class="slot"><div class="frame" data-fill="screens/2"><div class="ph"><div class="cam">&#9635;</div><div class="t1">Screen photo</div><div class="t2">assets/screens/ &middot; photo 2</div></div></div><figcaption>Venue &middot; Market</figcaption></figure>
      <figure class="slot"><div class="frame" data-fill="screens/3"><div class="ph"><div class="cam">&#9635;</div><div class="t1">Screen photo</div><div class="t2">assets/screens/ &middot; photo 3</div></div></div><figcaption>Venue &middot; Market</figcaption></figure>
      <figure class="slot"><div class="frame" data-fill="screens/4"><div class="ph"><div class="cam">&#9635;</div><div class="t1">Screen photo</div><div class="t2">assets/screens/ &middot; photo 4</div></div></div><figcaption>Venue &middot; Market</figcaption></figure>
      <figure class="slot"><div class="frame" data-fill="screens/5"><div class="ph"><div class="cam">&#9635;</div><div class="t1">Screen photo</div><div class="t2">assets/screens/ &middot; photo 5</div></div></div><figcaption>Venue &middot; Market</figcaption></figure>
      <figure class="slot"><div class="frame" data-fill="screens/6"><div class="ph"><div class="cam">&#9635;</div><div class="t1">Screen photo</div><div class="t2">assets/screens/ &middot; photo 6</div></div></div><figcaption>Venue &middot; Market</figcaption></figure>
    </div>
