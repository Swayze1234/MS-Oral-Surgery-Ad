  <text x="250" y="223" text-anchor="middle" font-family="'Playfair Display','DejaVu Serif','Liberation Serif',serif" font-size="29" font-weight="500" letter-spacing="3" fill="#111" style="font-variant-numeric:lining-nums">1858</text>
  <g fill="none" stroke="#111" stroke-width="2" stroke-linecap="round">
