  <text x="250" y="243" text-anchor="middle" textLength="292" lengthAdjust="spacing" font-family="'Inter','Liberation Sans',Arial,sans-serif" font-size="11.5" font-weight="500" fill="#111">PIZZA &amp; SOCIAL HOUSE</text>
